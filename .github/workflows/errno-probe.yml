name: errno-probe
on:
  push:
    branches: [probe/errno]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ref: [main, fix]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          if [ "${{ matrix.ref }}" = "main" ]; then R=https://github.com/hydra-db/selfgraph; B=main; else R=https://github.com/Jmohak2004/selfgraph; B=fix/connect-errno-by-code; fi
          git clone -q --depth 1 --branch $B $R sg && cd sg && pip install -q -e ".[kuzu,dev]"
      - shell: python
        working-directory: sg
        run: |
          import errno, socket, sys
          from selfgraph.errors import error_reason
          s = socket.socket()
          try:
              s.connect(("127.0.0.1", 9))
          except OSError as e:
              try:
                  try:
                      raise e
                  except OSError as inner:
                      raise RuntimeError("Cannot connect to API: ") from inner
              except RuntimeError as x:
                  print("RESULT", sys.platform, "${{ matrix.ref }}", "real refusal errno", e.errno, "->", repr(error_reason(x)))
      - shell: bash
        working-directory: sg
        env:
          SELFGRAPH_TEST_STORE: kuzu
        run: python -m pytest -q -p no:cacheprovider tests/test_llm.py 2>&1 | tail -3 | sed 's/^/TESTS ${{ matrix.ref }} /'
