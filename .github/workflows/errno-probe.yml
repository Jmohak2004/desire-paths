name: mem-probe
on:
  push:
    branches: [probe/errno]
permissions:
  contents: read
  packages: read
jobs:
  mem:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker run -d --name dp -p 7860:7860 ghcr.io/jmohak2004/desire-paths:latest
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:7860/api/status >/dev/null && break; sleep 2; done
          echo "MEM after boot: $(docker stats --no-stream --format '{{.MemUsage}}' dp)"
          for q in "Who manages the team that owns project Mesa?" "Which project is the service documented in 'Hidden Harbor Notes' part of?"; do
            curl -sf -X POST http://127.0.0.1:7860/api/ask -H 'content-type: application/json' -d "{\"question\":\"$q\",\"agent\":\"C\"}" >/dev/null; done
          curl -sf -X POST http://127.0.0.1:7860/api/mutate >/dev/null; curl -sf -X POST http://127.0.0.1:7860/api/revalidate >/dev/null
          echo "MEM after asks+heal: $(docker stats --no-stream --format '{{.MemUsage}}' dp)"
          docker exec dp sh -c 'for p in $(pgrep -f graph-node) $(pgrep -f uvicorn); do echo "PROC $p $(grep VmRSS /proc/$p/status)"; done'
