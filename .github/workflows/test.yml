name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Route learning, execution, retirement, pipeline (embedded Kuzu, no secrets)
        run: python -m pytest -q
      - name: Results artefacts regenerate exactly from committed results
        run: |
          python -m eval.calculator > /dev/null
          python scripts/update_readme.py
          git diff --exit-code README.md results/savings.md
